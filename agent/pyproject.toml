[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncallify"
version = "1.0.0"
description = "On-call assistant: diagnoses incidents, proposes one allowlisted fix, waits for approval, verifies recovery, and measures itself with A/B experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mongo = ["pymongo>=4.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mongomock>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
  "psycopg[binary]>=3.1",
  "pymongo>=4.6",
]

[project.scripts]
oncallify = "oncallify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncallify = ["store/migrations/*.sql", "diagnose/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: needs a real PostgreSQL (set ONCALLIFY_TEST_PG_URL)",
  "live: needs the running local stack",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["oncallify"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pymongo.*", "mongomock.*", "psycopg.*", "uvicorn.*"]
ignore_missing_imports = true
