# Optional: the same stack in containers, for machines with Docker.
# The primary, tested path is deploy/local (no Docker needed). Build the WAR and the
# gateway first (`make build`), then: docker compose -f deploy/docker-compose.yml up
#
# Note: this file is provided for convenience and was not exercised in the original
# build environment (no Docker daemon there). The CI integration job covers the same
# topology on a plain Ubuntu runner.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  tomcat:
    image: tomcat:10.1-jdk21
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      LEDGERLINE_CONFIG: /ledgerline/conf/ledgerline.properties
      CATALINA_OPTS: -Xms128m -Xmx384m -Duser.timezone=UTC
    volumes:
      - ../ledgerline/target/ledgerline.war:/usr/local/tomcat/webapps/ledgerline.war:ro
      - ../.run/ledgerline:/ledgerline
    ports: ["8080:8080"]

  gateway:
    image: node:22-slim
    working_dir: /app
    command: ["node", "dist/server.js"]
    environment:
      GATEWAY_PORT: "7070"
      MONGO_URL: mongodb://mongo:27017
      AGENT_URL: http://host.docker.internal:7080
      ONCALLIFY_INGEST_TOKEN: ${ONCALLIFY_INGEST_TOKEN:?set ONCALLIFY_INGEST_TOKEN}
    volumes:
      - ../gateway:/app:ro
    ports: ["7070:7070"]
    depends_on: [mongo]
