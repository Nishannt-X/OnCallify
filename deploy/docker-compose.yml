services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  tomcat:
    image: tomcat:10.1-jdk21
    entrypoint: ["bash", "-c", "cp -r /usr/local/tomcat/webapps.dist/manager /usr/local/tomcat/webapps/manager && echo '<Context privileged=\"true\"/>' > /usr/local/tomcat/webapps/manager/META-INF/context.xml && catalina.sh run"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      LEDGERLINE_CONFIG: /ledgerline/conf/ledgerline.properties
      CATALINA_OPTS: -Xms128m -Xmx384m -Duser.timezone=UTC
    volumes:
      - ../ledgerline/target/ledgerline.war:/usr/local/tomcat/webapps/ledgerline.war:ro
      - ../.run/ledgerline:/ledgerline
      - ../.run/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml:ro
    ports: ["8080:8080"]

  gateway:
    image: node:22-slim
    working_dir: /app
    command: ["node", "dist/server.js"]
    environment:
      GATEWAY_PORT: "7070"
      MONGO_URL: mongodb://mongo:27017
      AGENT_URL: http://host.docker.internal:7080
      ONCALLIFY_INGEST_TOKEN: ${ONCALLIFY_INGEST_TOKEN:-oncallify-ingest-token}
      GATEWAY_RULES: /app/rules.json
    volumes:
      - ../gateway:/app:ro
    ports: ["7070:7070"]
    depends_on: [mongo]
