name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: ledgerline (Java 21, Maven, JUnit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ledgerline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with: { name: ledgerline-war, path: ledgerline/target/ledgerline.war }

  gateway:
    name: gateway (Node 22, Express, Jest, MongoDB)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: gateway/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env: { MONGO_URL: "mongodb://127.0.0.1:27017" }
      - run: npm run build

  agent:
    name: agent (Python 3.12, pytest, mypy, ruff, PostgreSQL)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: oncallify_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q --cov=oncallify --cov-report=term-missing
        env: { ONCALLIFY_TEST_PG_URL: "postgresql://postgres:postgres@127.0.0.1:5432/oncallify_test" }

  shell:
    name: runbooks (bash, shellcheck, bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck bats
      - run: shellcheck -x -P SCRIPTDIR runbooks/linux/*.sh deploy/local/*.sh ledgerline/build.sh
      - run: bats runbooks/tests/runbooks.bats

  powershell:
    name: runbooks (PowerShell, PSScriptAnalyzer, Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer, Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
      - shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path runbooks/windows -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }
      - shell: pwsh
        run: |
          git config --global user.name ci; git config --global user.email ci@example.com
          $r = Invoke-Pester runbooks/tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  web:
    name: dashboard (React, TypeScript, Vitest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: integration (Tomcat + Postgres + gateway + agent, a real incident)
    runs-on: ubuntu-latest
    needs: [java, gateway, agent, shell]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: ledgerline-war, path: ledgerline/target }
      - run: sudo apt-get update -q && sudo apt-get install -y -q tomcat10 tomcat10-admin postgresql-client
      - run: pip install -e "agent[dev]"
      - run: cd gateway && npm ci && npm run build
      - run: deploy/local/setup.sh
      - run: deploy/local/stack.sh up
      - run: python3 -m oncallify.cli approver --name ci --token ci-approver-token
      - run: python3 scripts/e2e_demo.py --approver-token ci-approver-token
      - if: always()
        run: tail -n 200 .run/logs/*.log .run/tomcat/logs/catalina.out || true

  eval-gate:
    name: experiment gate (candidate must be non-inferior)
    runs-on: ubuntu-latest
    needs: [agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "agent[dev]"
      - name: replay the corpus and gate the default diagnoser against the baseline
        run: |
          python3 -m oncallify.cli eval gate --baseline rules-v1 --candidate rules-v2
          python3 -m oncallify.cli eval gate --baseline rules-v2 --candidate ml-logreg
      - name: A/A check of the statistics
        run: python3 -m oncallify.cli eval validate --sims 1000
